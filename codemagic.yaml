workflows:
  # --- Быстрая проверка сборки iOS без подписи (для верификации нативного кода) ---
  ios-compile-check:
    name: iOS compile check (no signing)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Flutter version
        script: flutter --version
      - name: Get packages
        script: flutter pub get
      - name: Generate iOS config + pods
        script: flutter build ios --config-only --no-codesign
      - name: Pod install
        script: |
          cd ios && pod install --repo-update && cd ..
      - name: Build iOS (release, no codesign)
        script: flutter build ios --release --no-codesign --verbose
    artifacts:
      - flutter_drive.log
      - /tmp/xcodebuild_logs/*.log
      - build/ios/**/*.log

  # --- Релизная сборка iOS (.ipa) с подписью App Store Connect ---
  ios-release:
    name: iOS Release (signed IPA)
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      app_store_connect: codemagic   # имя интеграции App Store Connect в Codemagic
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.myhealth.app
      vars:
        BUNDLE_ID: "com.myhealth.app"
        APP_STORE_APPLE_ID: 0000000000   # Apple ID приложения в App Store Connect
        API_BASE_URL: "https://api.example.com"   # боевой адрес бэкенда
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Generate iOS config + pods
        script: flutter build ios --config-only --release
      - name: Pod install
        script: |
          cd ios && pod install --repo-update && cd ..
      - name: Set up provisioning profiles
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          flutter build ipa --release \
            --dart-define=API_BASE_URL=$API_BASE_URL \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Загрузить в TestFlight (бета). Для релиза в App Store — submit_to_app_store: true.
        submit_to_testflight: true
        # submit_to_app_store: true
      email:
        recipients:
          - pslso0@outlook.com

  # --- Android (APK + AAB) ---
  android-release:
    name: Android Release
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      flutter: stable
      vars:
        API_BASE_URL: "https://api.example.com"   # боевой адрес бэкенда
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Build APK + AAB
        script: |
          flutter build apk --release --dart-define=API_BASE_URL=$API_BASE_URL
          flutter build appbundle --release --dart-define=API_BASE_URL=$API_BASE_URL
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/bundle/release/*.aab
    publishing:
      email:
        recipients:
          - pslso0@outlook.com
