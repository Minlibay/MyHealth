workflows:
  # --- Быстрая проверка сборки iOS без подписи (для верификации нативного кода) ---
  ios-compile-check:
    name: iOS compile check (no signing)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Flutter version
        script: flutter --version
      - name: Get packages
        script: flutter pub get
      - name: Generate iOS config + pods
        script: flutter build ios --config-only --no-codesign
      - name: Pod install
        script: |
          cd ios && pod install --repo-update && cd ..
      - name: Build iOS (release, no codesign)
        script: flutter build ios --release --no-codesign --verbose
    artifacts:
      - flutter_drive.log
      - /tmp/xcodebuild_logs/*.log
      - build/ios/**/*.log

  # --- Релизная сборка iOS (.ipa) с подписью App Store Connect ---
  ios-release:
    name: iOS Release (signed IPA)
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      app_store_connect: HEALTH   # имя интеграции App Store Connect в Codemagic
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.myhealthv.app"
        APP_STORE_APPLE_ID: 6785419314   # Apple ID приложения в App Store Connect
        API_BASE_URL: "http://185.40.4.195:53917"   # боевой адрес бэкенда (IP:порт)
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Set up code signing (clean stale certs + fetch profiles)
        script: |
          set -ex
          keychain initialize

          PRIVATE_KEY=/tmp/cm_distribution.key
          openssl genrsa -out "$PRIVATE_KEY" 2048

          # Очистка зависших сертификатов, чтобы не упираться в лимиты Apple (HTTP 409)
          for type in IOS_DISTRIBUTION DISTRIBUTION; do
            echo "--- Listing existing $type certs ---"
            JSON=$(app-store-connect list-certificates --type "$type" --json 2>/dev/null || echo "[]")
            ids=$(printf '%s' "$JSON" | python3 -c 'import sys,json;d=json.load(sys.stdin);print("\n".join(c.get("id","") for c in (d if isinstance(d,list) else [])))' 2>/dev/null || true)
            for id in $ids; do
              [ -n "$id" ] || continue
              echo "Revoking stale $type certificate $id"
              app-store-connect certificates delete "$id" 2>/dev/null \
                || app-store-connect delete-certificate "$id" 2>/dev/null \
                || true
            done
          done

          # Получаем актуальные файлы подписи
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --platform IOS \
            --type IOS_APP_STORE \
            --certificate-key "@file:$PRIVATE_KEY" \
            --create

          keychain add-certificates
          
          # Эта команда не только настраивает проект, но и создает 
          # валидный файл параметров экспорта по пути /Users/builder/export_options.plist
          xcode-project use-profiles
      - name: Pod install
        script: |
          cd ios && pod install --repo-update && cd ..
      - name: Bump build number from latest TestFlight build
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo "0")
          export NEW_BUILD_NUMBER=$((LATEST + 1))
          echo "BUILD_NUMBER=$NEW_BUILD_NUMBER" >> $CM_ENV
          echo "Next build number: $NEW_BUILD_NUMBER"
      - name: Build IPA
        script: |
          # Собираем и сразу экспортируем стандартным методом Flutter.
          # Файл export_options.plist берется из папки, куда его сохранил xcode-project use-profiles.
          flutter build ipa --release \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist \
            --dart-define=API_BASE_URL=$API_BASE_URL
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        # Автоматическая загрузка готового .ipa в TestFlight
        submit_to_testflight: true
      email:
        recipients:
          - pslso0@outlook.com

  # --- Android (APK + AAB) ---
  android-release:
    name: Android Release
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      flutter: stable
      vars:
        API_BASE_URL: "http://185.40.4.195:53917"   # боевой адрес бэкенда (IP:порт)
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Build APK + AAB
        script: |
          flutter build apk --release --dart-define=API_BASE_URL=$API_BASE_URL
          flutter build appbundle --release --dart-define=API_BASE_URL=$API_BASE_URL
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/bundle/release/*.aab
    publishing:
      email:
        recipients:
          - pslso0@outlook.com
