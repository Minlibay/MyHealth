workflows:
  # --- Быстрая проверка сборки iOS без подписи (для верификации нативного кода) ---
  ios-compile-check:
    name: iOS compile check (no signing)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Flutter version
        script: flutter --version
      - name: Get packages
        script: flutter pub get
      - name: Generate iOS config + pods
        script: flutter build ios --config-only --no-codesign
      - name: Pod install
        script: |
          cd ios && pod install --repo-update && cd ..
      - name: Build iOS (release, no codesign)
        script: flutter build ios --release --no-codesign --verbose
    artifacts:
      - flutter_drive.log
      - /tmp/xcodebuild_logs/*.log
      - build/ios/**/*.log

  # --- Релизная сборка iOS (.ipa) с подписью App Store Connect ---
  ios-release:
    name: iOS Release (signed IPA)
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      app_store_connect: HEALTH   # имя интеграции App Store Connect в Codemagic
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.myhealthv.app"
        APP_STORE_APPLE_ID: 6785419314   # Apple ID приложения в App Store Connect
        API_BASE_URL: "http://185.40.4.195:53917"   # боевой адрес бэкенда (IP:порт)
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Set up code signing (create cert/profile if missing)
        script: |
          keychain initialize
          # Скачиваем/создаем App Store сертификаты и профили
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Pod install
        script: |
          cd ios && pod install --repo-update && cd ..
      - name: Build IPA
        script: |
          # Используем --export-method=app-store. 
          # Это заставит Flutter сгенерировать .ipa для TestFlight, используя профили от Codemagic
          flutter build ipa --release \
            --export-method=app-store \
            --dart-define=API_BASE_URL=$API_BASE_URL
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Автоматическая загрузка в TestFlight
        submit_to_testflight: true
      email:
        recipients:
          - pslso0@outlook.com

  # --- Android (APK + AAB) ---
  android-release:
    name: Android Release
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      flutter: stable
      vars:
        API_BASE_URL: "http://185.40.4.195:53917"   # боевой адрес бэкенда (IP:порт)
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Build APK + AAB
        script: |
          flutter build apk --release --dart-define=API_BASE_URL=$API_BASE_URL
          flutter build appbundle --release --dart-define=API_BASE_URL=$API_BASE_URL
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/bundle/release/*.aab
    publishing:
      email:
        recipients:
          - pslso0@outlook.com
